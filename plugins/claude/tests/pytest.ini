[pytest]
# Plugin module test suite — see plugin-claude/tests/README.md.
# Layer 1 (unit, lib/) and Layer 2 (hook integration, hooks/ + build/) live
# here. Layer 3 (e2e) is in e2e/scenarios/.
testpaths = .
# `build` is in pytest's DEFAULT norecursedirs, so plugin-claude/tests/build/ was never
# reached by `pytest plugin-claude/tests` and its tests had never run in CI (#233) —
# including the ones guarding the build and publish path, which is how #232
# survived eight releases. This list is the default minus `build`.
norecursedirs = *.egg .* _darcs CVS dist node_modules venv {arch}
addopts = -ra --strict-markers --tb=short
markers =
    unit: pure-logic tests in plugin-claude/tests/lib/ — no subprocess, no network
    hook: integration tests that exec real .sh hooks in plugin-claude/tests/hooks/
    build: tests that exec the build script in plugin-claude/tests/build/
    slow: tests that take > 1s; CI may exclude them on PR runs
